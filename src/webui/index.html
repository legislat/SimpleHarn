<!doctype html>
<!-- SimpleHarn — control page (Step 14). Pico CSS base, vanilla JS only; all
     state comes from /har/* JSON and every action is a headless API call. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimpleHarn</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/pico.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <button id="sh-theme-toggle" class="sh-mini sh-theme-toggle outline">Light</button>
    <!-- Static, like the theme toggle: an operator holding a wrong token never gets a
         rendered header, and this is their way back in (app.js signIn). -->
    <button id="sh-token-toggle" class="sh-mini sh-token-toggle outline">Sign in</button>
    <header class="sh-header" id="sh-header">
      <!-- rendered by app.js: title, loaded count, the sticky tab/slot strip, memory -->
    </header>
    <!-- The error banner sits between the tab strip (the bottom of the header)
         and the model table, in flow: it never covers page text and never
         scrolls independently. app.js fills it on a failed action. -->
    <div class="sh-flash-host" id="sh-flash-host">
      <div id="sh-flash" class="sh-flash" role="status" aria-live="polite" hidden></div>
    </div>
    <main class="container" id="sh-main">
      <!-- rendered by app.js: model table, recent jobs -->
    </main>
    <script src="/app.js"></script>
  </body>
</html>
