# cargo-deny policy (FR-14). The deny CI job runs this file.
# Rule: a new dependency must land inside these gates, or the change names
# the exception and why (docs/process/ENGINEERING.md, Dependency policy).

[advisories]
yanked = "deny"
# RUSTSEC-2024-0370 (proc-macro-error unmaintained): reached through
# tray-icon -> libappindicator/muda -> gtk -> glib -> glib-macros and
# gtk3-macros, and reverse-tree checks show that chain exists only when the
# tray feature is built for a Linux target. A Windows build (with or without
# tray) uses the win32 backend and pulls no gtk chain; a headless build pulls
# none on any target, and the published Linux artifact builds without tray,
# so no shipped artifact ever contains the crate. The ignore stays because
# cargo-deny scans the whole lock graph, platform-conditional edges included.
# No safe upgrade exists (it is a proc-macro dependency of the pinned glib
# 0.18 stack); revisit when tray-icon or the gtk stack updates.
ignore = ["RUSTSEC-2024-0370"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
]

# fnv declares its license as the free-text field "Apache-2.0 / MIT", which is
# not valid SPDX, so the scanner cannot match the allow list. Both halves of
# that field are already allowed above.
[[licenses.exceptions]]
name = "fnv"
allow = ["MIT", "Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
