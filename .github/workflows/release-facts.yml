# Release-facts CI. Cardless: no card tests, no model loads, no engine start,
# and no port bind in either job; the card gate stays operator-only per
# docs/process/VERIFICATION.md.
#
# Trigger A (tag push, v*): re-runs the release facts on the pushed tag, the
# same way step 7 of the release section in docs/process/GIT_WORKFLOW.md
# requires, so a tag that disagrees with Cargo.toml, the changelog, the README
# claim, or the doc facts cannot pass unseen.
#
# Trigger B (release published): a published GitHub release must carry an
# artifact; a release with zero assets fails with a named defect. No
# third-party actions run in this job; gh ships on the runner.
name: Release facts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v1.5.1.6)'
        required: true
  release:
    types: [published]

jobs:
  # Trigger A. fetch-depth: 0 makes every tag visible, so release-check.ps1
  # can resolve the latest tag on the detached tag checkout.
  tag-facts:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Doc facts
        shell: pwsh
        run: node scripts/check-doc-facts.mjs

      # Without -Prepare: the pushed tag must already equal v<Cargo version>.
      - name: Release check (tag mode)
        shell: pwsh
        run: ./scripts/release-check.ps1

  # Trigger B. GITHUB_REF_NAME is the release tag name on a release event.
  # An API or token failure exits with its own message, so a zero-asset
  # verdict and an unreadable release are never conflated.
  release-artifact:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Published release carries an artifact
        shell: bash
        run: |
          status=0
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length') || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::gh release view for $GITHUB_REF_NAME failed with exit $status; the asset list is unreadable, which is an API or token defect, not a zero-asset release."
            exit 1
          fi
          if [ "$assets" -eq 0 ]; then
            echo "::error::published release $GITHUB_REF_NAME carries zero assets; a published release must attach the release zip artifact."
            exit 1
          fi
          echo "PASS: published release $GITHUB_REF_NAME carries $assets asset(s)."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download published assets
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --clobber

      - name: Verify every asset against its checksum
        shell: bash
        run: node scripts/check-release-sums.mjs dist

      - name: Verify the release body has no rendering defects
        shell: bash
        run: |
          set -o pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | node scripts/check-release-body.mjs
  # Trigger A, Linux port (D4): build the headless Linux artifact from the tag
  # in CI and publish its hash beside it. The Linux card verdict stays BLOCKED:
  # a build here proves the binary compiles and packages, never that an engine
  # loads on a Linux GPU.
  linux-artifact:
    if: github.event_name == 'push'
    # Explicit host image, never ubuntu-latest. The host only carries Docker:
    # the artifact's glibc floor comes from the pinned container base below,
    # not from the runner image.
    runs-on: ubuntu-24.04
    env:
      # Pinned artifact base (RELEASE-LINUX-GLIBC, 2026-11-10). manylinux2014
      # carries glibc 2.17 and a complete toolchain, so the published binary
      # needs no distro library newer than the measured floor below: it runs
      # on Ubuntu 18.04, Debian 9 and RHEL 7 or newer. A static musl build was
      # probed and rejected: the probed static-pie musl build answered
      # "Dynamic loading not supported" for libnvidia-ml.so.1 and could not
      # read NVML, so no musl artifact ships.
      # The image tag is explicit, never :latest: a base bump is a deliberate,
      # reviewed change. The same base and floor are on record in
      # docs/reference/COMPATIBILITY.md and README Requirements.
      ARTIFACT_BASE: quay.io/pypa/manylinux2014_x86_64:2026.11.07-1
      # Documented glibc floor: the highest required GLIBC_* symbol version
      # this base produces (measured with objdump -T, 2026-11-10).
      # scripts/check-doc-facts.mjs ties this value to README Requirements and
      # COMPATIBILITY; the floor check below fails if a build needs more, so
      # the published artifact can never exceed its documented floor silently.
      GLIBC_FLOOR: '2.16'
      # Release toolchain for the Linux artifact; keep equal to the toolchain
      # the other jobs install and to rust-toolchain.toml.
      RUST_RELEASE_TOOLCHAIN: '1.98.1'
    steps:
      # fetch-depth: 0 so the exact tag is present on the checkout: `build.rs`
      # embeds it as the artifact's release identity, and a shallow checkout
      # would silently stamp no release into the published binary.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The base image carries no Rust, and JS actions cannot execute inside
      # a glibc-2.17 container, so the build runs through docker run with the
      # toolchain installed inside the container and pinned by env. Build and
      # package share one container because the binary lives on container-local
      # disk: the target directory stays off the checkout.
      - name: Build, floor-check, and package in the pinned base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull "$ARTIFACT_BASE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -v "$GITHUB_WORKSPACE/dist":/dist \
            -e CARGO_HOME=/tmp/cargo -e RUSTUP_HOME=/tmp/rustup -e HOME=/tmp \
            -e TOOLCHAIN="$RUST_RELEASE_TOOLCHAIN" \
            -e FLOOR="$GLIBC_FLOOR" \
            -e GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            -e SIMPLEHARN_RELEASE_TAG="$GITHUB_REF_NAME" \
            "$ARTIFACT_BASE" bash -euo pipefail -c '
              export CARGO_TARGET_DIR=/tmp/tgt
              curl -sSf --proto "=https" --tlsv1.2 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain "$TOOLCHAIN" >/dev/null
              export PATH="$CARGO_HOME/bin:$PATH"
              cargo build --release --locked
              max=$(objdump -T /tmp/tgt/release/simpleharn \
                | grep -oE "GLIBC_[0-9.]+" | sed "s/GLIBC_//" | sort -V | tail -1)
              echo "measured glibc floor: $max (documented: $FLOOR)"
              if [ "$(printf "%s\n%s\n" "$FLOOR" "$max" | sort -V | tail -1)" != "$FLOOR" ]; then
                echo "::error::the artifact requires GLIBC_$max, above the documented floor $FLOOR; re-verify the base and raise the docs and this env value together, never silently."
                exit 1
              fi
              ver="${GITHUB_REF_NAME#v}"
              root="SimpleHarn-${ver}-linux-x64"
              mkdir -p "/dist/${root}"
              cp /tmp/tgt/release/simpleharn "/dist/${root}/"
              cp /work/README.md /work/LICENSE "/dist/${root}/"
              tar -C /dist -czf "/dist/${root}.tar.gz" "${root}"
              sha256sum "/dist/${root}.tar.gz" | sed "s#/dist/##" > "/dist/${root}.tar.gz.sha256"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: simpleharn-linux-x64
          path: dist/SimpleHarn-*.tar.gz*
          if-no-files-found: error

  # Trigger A, Windows port: build the shipped tray binary from the exact tag,
  # package the five-entry zip, prove the embedded release identity and the
  # absence of stale product strings, and upload a workflow artifact. The
  # publish wrapper, not this job, creates the GitHub release.
  windows-artifact:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Assert the checkout is the exact tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') {
            throw "RELEASE_TAG is not a release tag: $tag"
          }
          $exact = (git describe --tags --exact-match --match 'v*').Trim()
          if ($exact -ne $tag) {
            throw "checkout is $exact, not the requested tag $tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the shipped binary (first pass)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "$PWD\target-repro-a"
          cargo build --release --locked --features tray

      - name: Build the shipped binary (second pass)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "$PWD\target-repro-b"
          cargo build --release --locked --features tray

      - name: Compare the two builds
        shell: pwsh
        run: |
          $a = (Get-FileHash -LiteralPath 'target-repro-a\release\simpleharn.exe' -Algorithm SHA256).Hash
          $b = (Get-FileHash -LiteralPath 'target-repro-b\release\simpleharn.exe' -Algorithm SHA256).Hash
          if ($a -eq $b) {
            $repro = 'identical'
            Write-Output "REPRO identical: $a"
          } else {
            $repro = 'different'
            Write-Warning "REPRO differs: first $a second $b (MSVC PE COFF TimeDateStamp/debug directory; no reproducible-build claim)"
          }
          "HASH=$a" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REPRO=$repro" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "- repro: $repro ($a vs $b); a difference is the MSVC PE timestamp/debug directory, not a build-input difference" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Package the five-entry Windows zip and sums
        shell: pwsh
        run: |
          ./scripts/make-public-asset.ps1 `
            -Version $env:RELEASE_TAG `
            -ExePath target-repro-a\release\simpleharn.exe `
            -ExpectedSha256 $env:HASH `
            -OutDir dist

      - name: Verify identity, strings, and checksums in the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter '*-win-x64.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'packaged zip is missing' }
          $pkg = Join-Path $env:RUNNER_TEMP ('pkg-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $pkg -Force
          $exe = Join-Path $pkg 'simpleharn.exe'
          $report = (& $exe --version 2>&1 | Out-String)
          $ver = $env:RELEASE_TAG.TrimStart('v')
          if ($report -notmatch ('(?m)^release ' + [regex]::Escape($ver) + '\s*$')) {
            throw "packaged exe does not report release $ver`: $report"
          }
          ./scripts/check-shipped-strings.ps1 -ExePath $exe
          if ($LASTEXITCODE -ne 0) { throw 'packaged exe carries a stale product string' }
          node scripts/check-release-sums.mjs dist

      - name: Write build provenance beside the artifact
        shell: pwsh
        run: |
          @(
            "tag=$env:RELEASE_TAG",
            "commit=$(git rev-parse HEAD)",
            "rust=$(rustc --version)",
            "image=$env:ImageOS",
            "repro=$env:REPRO",
            "exe_sha256=$env:HASH",
            "runner=$env:RUNNER_OS"
          ) | Set-Content -LiteralPath dist\build-provenance.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: simpleharn-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/PUBLICATION-SCRUB.md
            dist/build-provenance.txt
          if-no-files-found: error

