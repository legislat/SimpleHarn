# Release-facts CI. Cardless: no card tests, no model loads, no engine start,
# and no port bind in either job; the card gate stays operator-only per
# docs/process/VERIFICATION.md.
#
# Trigger A (tag push, v*): re-runs the release facts on the pushed tag, the
# same way step 7 of the release section in docs/process/GIT_WORKFLOW.md
# requires, so a tag that disagrees with Cargo.toml, the changelog, the README
# claim, or the doc facts cannot pass unseen.
#
# Trigger B (release published): a published GitHub release must carry an
# artifact; a release with zero assets fails with a named defect. No
# third-party actions run in this job; gh ships on the runner.
name: Release facts

on:
  push:
    tags: ['v*']
  release:
    types: [published]

jobs:
  # Trigger A. fetch-depth: 0 makes every tag visible, so release-check.ps1
  # can resolve the latest tag on the detached tag checkout.
  tag-facts:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Doc facts
        shell: pwsh
        run: node scripts/check-doc-facts.mjs

      # Without -Prepare: the pushed tag must already equal v<Cargo version>.
      - name: Release check (tag mode)
        shell: pwsh
        run: ./scripts/release-check.ps1

  # Trigger B. GITHUB_REF_NAME is the release tag name on a release event.
  # An API or token failure exits with its own message, so a zero-asset
  # verdict and an unreadable release are never conflated.
  release-artifact:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Published release carries an artifact
        shell: bash
        run: |
          status=0
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length') || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::gh release view for $GITHUB_REF_NAME failed with exit $status; the asset list is unreadable, which is an API or token defect, not a zero-asset release."
            exit 1
          fi
          if [ "$assets" -eq 0 ]; then
            echo "::error::published release $GITHUB_REF_NAME carries zero assets; a published release must attach the release zip artifact."
            exit 1
          fi
          echo "PASS: published release $GITHUB_REF_NAME carries $assets asset(s)."
  # Trigger A, Linux port (D4): build the headless Linux artifact from the tag
  # in CI and publish its hash beside it. The Linux card verdict stays BLOCKED:
  # a build here proves the binary compiles and packages, never that an engine
  # loads on a Linux GPU.
  linux-artifact:
    if: github.event_name == 'push'
    # Explicit host image, never ubuntu-latest. The host only carries Docker:
    # the artifact's glibc floor comes from the pinned container base below,
    # not from the runner image.
    runs-on: ubuntu-24.04
    env:
      # Pinned artifact base (RELEASE-LINUX-GLIBC, 2026-11-10). manylinux2014
      # carries glibc 2.17 and a complete toolchain, so the published binary
      # needs no distro library newer than the measured floor below: it runs
      # on Ubuntu 18.04, Debian 9 and RHEL 7 or newer. A static musl build was
      # probed and rejected: the probed static-pie musl build answered
      # "Dynamic loading not supported" for libnvidia-ml.so.1 and could not
      # read NVML, so no musl artifact ships.
      # The image tag is explicit, never :latest: a base bump is a deliberate,
      # reviewed change. The same base and floor are on record in
      # docs/reference/COMPATIBILITY.md and README Requirements.
      ARTIFACT_BASE: quay.io/pypa/manylinux2014_x86_64:2026.11.07-1
      # Documented glibc floor: the highest required GLIBC_* symbol version
      # this base produces (measured with objdump -T, 2026-11-10).
      # scripts/check-doc-facts.mjs ties this value to README Requirements and
      # COMPATIBILITY; the floor check below fails if a build needs more, so
      # the published artifact can never exceed its documented floor silently.
      GLIBC_FLOOR: '2.16'
      # Release toolchain for the Linux artifact; keep equal to the toolchain
      # the other jobs install and to rust-toolchain.toml.
      RUST_RELEASE_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v7

      # The base image carries no Rust, and JS actions cannot execute inside
      # a glibc-2.17 container, so the build runs through docker run with the
      # toolchain installed inside the container and pinned by env. Build and
      # package share one container because the binary lives on container-local
      # disk: the target directory stays off the checkout.
      - name: Build, floor-check, and package in the pinned base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull "$ARTIFACT_BASE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -v "$GITHUB_WORKSPACE/dist":/dist \
            -e CARGO_HOME=/tmp/cargo -e RUSTUP_HOME=/tmp/rustup -e HOME=/tmp \
            -e TOOLCHAIN="$RUST_RELEASE_TOOLCHAIN" \
            -e FLOOR="$GLIBC_FLOOR" \
            -e GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            "$ARTIFACT_BASE" bash -euo pipefail -c '
              export CARGO_TARGET_DIR=/tmp/tgt
              curl -sSf --proto "=https" --tlsv1.2 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain "$TOOLCHAIN" >/dev/null
              export PATH="$CARGO_HOME/bin:$PATH"
              cargo build --release --locked
              max=$(objdump -T /tmp/tgt/release/simpleharn \
                | grep -oE "GLIBC_[0-9.]+" | sed "s/GLIBC_//" | sort -V | tail -1)
              echo "measured glibc floor: $max (documented: $FLOOR)"
              if [ "$(printf "%s\n%s\n" "$FLOOR" "$max" | sort -V | tail -1)" != "$FLOOR" ]; then
                echo "::error::the artifact requires GLIBC_$max, above the documented floor $FLOOR; re-verify the base and raise the docs and this env value together, never silently."
                exit 1
              fi
              ver="${GITHUB_REF_NAME#v}"
              root="SimpleHarn-${ver}-linux-x64"
              mkdir -p "/dist/${root}"
              cp /tmp/tgt/release/simpleharn "/dist/${root}/"
              cp /work/README.md /work/LICENSE "/dist/${root}/"
              tar -C /dist -czf "/dist/${root}.tar.gz" "${root}"
              sha256sum "/dist/${root}.tar.gz" | sed "s#/dist/##" > "/dist/${root}.tar.gz.sha256"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: simpleharn-linux-x64
          path: dist/SimpleHarn-*.tar.gz*
          if-no-files-found: error
